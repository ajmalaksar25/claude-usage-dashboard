[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-dashboard"
version = "0.1.0"
description = "Local Claude Code usage analytics: terminal CLI, web dashboard, and multi-account profile manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gmail = [
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
]

[project.scripts]
claude-usage = "cli:main"
ccm = "ccm:main"

[project.urls]
Repository = "https://github.com/ajmalaksar25/claude-usage-dashboard"

[tool.hatch.build.targets.wheel]
include = [
    "cli.py",
    "ccm.py",
    "dashboard.py",
    "indexer.py",
    "pricing.py",
    "billing.py",
    "gmail_scraper.py",
    "static/**",
    "templates/**",
]

[tool.hatch.build.targets.wheel.force-include]
"static" = "static"
"templates" = "templates"
